name: Fresh install

# A4 from docs/plans/0.3-validation-plan.md: validate the actual user
# first-run path — `make setup` → `brig up` → `brig run alpine` — which
# the main E2E job bypasses (it pre-constructs ~/.brig from the
# workspace to keep cold-start time manageable).
#
# Cost-gated: only runs when the install/provisioning surface changes.
# Weekly cron catches drift from upstream apt packages, runsc release
# rotation, etc.

on:
  schedule:
    - cron: "0 5 * * 1"  # Weekly Monday 05:00 UTC (1h after main E2E cron).
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Makefile"
      - "scripts/provision-vm.sh"
      - "scripts/fresh-install-test.sh"
      - "src/brig/vm/**"
      - "src/brig/commands/system_cmd.py"      # brig init / brig up
      - "src/brig/commands/convenience_cmd.py" # brig up / brig down
      - "src/warden/proxy.py"                  # warden start
      - "pyproject.toml"
      - ".github/workflows/fresh-install.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub-hosted macos-15 runners don't expose nested virtualization,
  # which Lima's VZ driver requires. Probe in a tiny preflight job;
  # gate the main job on the result. See e2e.yml for the same pattern.
  check-vz:
    runs-on: macos-15
    timeout-minutes: 2
    outputs:
      available: ${{ steps.hv.outputs.available }}
    steps:
      - id: hv
        run: |
          HV=$(sysctl -n kern.hv_support 2>/dev/null || echo 0)
          echo "kern.hv_support=$HV"
          if [ "$HV" = "1" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::fresh-install will be skipped — nested virtualization unavailable on this runner. Re-run on a bare-metal macOS host."
          fi

  fresh-install:
    needs: check-vz
    if: needs.check-vz.outputs.available == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Lima
        run: brew install lima

      - name: Install uv
        # make setup uses uv (pyproject already declares it as the dep
        # manager). Use the official installer.
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run fresh-install test
        env:
          BRIG_FRESH_INSTALL_TEST_OK: "1"
        run: ./scripts/fresh-install-test.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/fresh-install-logs
          limactl list > /tmp/fresh-install-logs/limactl-list.log 2>&1 || true
          cp ~/.lima/brig/serial.log /tmp/fresh-install-logs/ 2>/dev/null || true
          cp ~/.lima/brig/ha.stderr.log /tmp/fresh-install-logs/ 2>/dev/null || true
          limactl shell brig -- sudo journalctl --no-pager -n 200 \
            > /tmp/fresh-install-logs/journalctl.log 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fresh-install-logs
          path: /tmp/fresh-install-logs/
          retention-days: 7
