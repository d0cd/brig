name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        # Floor: 65% (current actual: 66%). Audit-pass deleted ~2200
        # uncovered lines (tui, dashboard, summarizer, signer, canary,
        # tor, stats) along with their thin tests; rebuilt with 100+
        # new tests for the survivors. Goal for 0.4: convenience_cmd /
        # watchdog_cmd / sdk async-path coverage to push back to 70%.
        run: |
          pytest --cov=src --cov-report=term --cov-report=xml --cov-fail-under=65 -v -m "not slow" --ignore=tests/benchmarks

      - name: Per-package coverage gate
        # Ratchet on security-critical modules (B6 from
        # docs/plans/0.3-validation-plan.md). Global 65% wouldn't catch
        # a regression that drops src/brig/security from 95% → 70%.
        if: matrix.python-version == '3.12'
        run: python scripts/check-coverage-per-module.py coverage.xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.0

      - name: Run ruff
        run: |
          ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy==1.13.0 pyyaml types-PyYAML

      - name: Run mypy
        run: |
          mypy src/brig/ --ignore-missing-imports --follow-imports=silent

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install bandit
        run: |
          pip install bandit==1.8.0

      - name: Run security scan
        run: |
          bandit -r src/ -ll --skip B101,B104,B108

      - name: Check gVisor pin is in sync and non-placeholder
        # Both the lima.yaml.template (used by `brig init`) and
        # scripts/provision-vm.sh (used by `make setup`) install runsc.
        # They must declare the same GVISOR_RELEASE and same sha512s, and
        # neither may carry REPLACE_WITH_* placeholders into a release.
        # Weekly fetch-and-compare against upstream is in e2e.yml's cron run.
        run: ./scripts/check-gvisor-pin.sh

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install and audit dependencies
        # Install brig + its deps, then audit only the deps. brig itself
        # isn't on PyPI, so pip-audit can't look it up; piping `pip list`
        # minus brig into `--requirement` scopes the audit to the
        # transitive dependency surface we actually care about.
        run: |
          pip install pip-audit
          pip install .
          pip list --format=freeze | grep -v "^brig==" > /tmp/deps.txt
          pip-audit --strict --desc --requirement /tmp/deps.txt

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70 # v3.95.6
        with:
          extra_args: --only-verified

  pre-commit:
    # Runs the exact same hook config developers run locally. Catches drift
    # between .pre-commit-config.yaml and CI (e.g. mypy version skew).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit==4.3.0
      - name: Run all hooks
        # SKIP=no-commit-to-branch because we ARE on main / merge commits
        # here; the local hook prevents direct main pushes, not CI runs.
        run: SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure
