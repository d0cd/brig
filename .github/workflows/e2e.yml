name: E2E

on:
  schedule:
    - cron: "0 4 * * 1"  # Weekly Monday 04:00 UTC (cost control).
  workflow_dispatch:
  pull_request:
    branches: [main]
    # Any change under src/, tests/, install.sh, or the CI config itself
    # runs E2E. The previous narrow allowlist let refactors that touched
    # brig command modules (e.g. lifecycle.py, system.py) or SDK skip the
    # only path that exercises real Lima+podman+gVisor isolation.
    paths:
      - "src/**"
      - "tests/**"
      - "install.sh"
      - ".github/workflows/e2e.yml"
      - ".github/e2e/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CELL_VM_NAME: cell

jobs:
  gvisor-pin-drift:
    # Re-fetch the pinned sha512 from upstream and assert it still matches
    # the value in scripts/provision-vm.sh + src/brig/vm/lima.yaml.template.
    # Drift means Google rotated the binary under us; either the pin needs
    # updating or the bucket was tampered with. Cron-only — every PR run
    # would hammer the bucket for no value (file-sync check in ci.yml is
    # sufficient on PRs).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Fetch upstream sha512 + compare to pin
        run: ./scripts/check-gvisor-pin.sh --fetch

  # GitHub-hosted macos-15 runners are themselves M-series VMs and
  # don't expose nested virtualization (`kern.hv_support` == 0). The
  # E2E suite drives a real Lima VM + podman + gVisor, which Apple's
  # Virtualization framework refuses to start without VZ
  # (`VZErrorDomain Code=2 "Virtualization is not available on this
  # hardware."`). Probe once in a tiny preflight job; gate the
  # expensive e2e job on the result. Same pattern in fresh-install.yml.
  check-vz:
    runs-on: macos-15
    timeout-minutes: 2
    outputs:
      available: ${{ steps.hv.outputs.available }}
    steps:
      - id: hv
        run: |
          HV=$(sysctl -n kern.hv_support 2>/dev/null || echo 0)
          echo "kern.hv_support=$HV"
          if [ "$HV" = "1" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E will be skipped — nested virtualization unavailable on this runner. Re-run on a self-hosted bare-metal macOS host or via workflow_dispatch on a paid runner with nested-virt support."
          fi

  e2e:
    needs: check-vz
    if: needs.check-vz.outputs.available == 'true'
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install brig on host
        timeout-minutes: 3
        run: pip install -e .

      - name: Install Lima
        timeout-minutes: 3
        run: |
          brew install lima
          LIMA_VERSION=$(limactl --version | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "Lima version: $LIMA_VERSION"

      - name: Create brig home
        timeout-minutes: 1
        run: mkdir -p ~/.brig/{cells/addons,secrets,state/system}

      - name: Copy Lima YAML
        # Use the same template `brig init` ships. Removes the need for a
        # separate `.github/e2e/lima-ci.yaml` file and keeps CI in lockstep
        # with what users actually get.
        run: cp src/brig/vm/lima.yaml.template ~/.brig/lima.yaml

      - name: Install addons
        run: |
          cp src/brig/warden_addons/*.py ~/.brig/cells/addons/
          cat > ~/.brig/cells/network-policy.json << 'EOF'
          {
            "allow": [
              "pypi.org",
              "*.pythonhosted.org",
              "files.pythonhosted.org",
              "github.com",
              "api.github.com",
              "*.githubusercontent.com",
              "registry.npmjs.org"
            ],
            "deny": [],
            "rate_limits": {"default": {"rate": 100, "burst": 500}},
            "log_filter": {"exclude_hosts": [], "exclude_paths": ["/health", "/ping"], "sample_rate": 1.0},
            "policy_trace": {"enabled": true, "include_rule_details": true, "include_timing": false}
          }
          EOF

      - name: Restore VM cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        id: vm-cache
        with:
          path: ~/.lima/cell/
          key: lima-vm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/brig/vm/lima.yaml.template') }}

      - name: Create VM (cache miss)
        if: steps.vm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          limactl create --name=cell ~/.brig/lima.yaml
          limactl start cell
          # Poll for Running state.
          for i in $(seq 1 60); do
            STATUS=$(limactl list --json | python3 -c "import sys,json; vms=json.load(sys.stdin); print(next((v['status'] for v in vms if v['name']=='cell'), 'unknown'))" 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "Running" ]; then
              echo "VM is running after ${i}s"
              break
            fi
            sleep 5
          done
          # Verify podman and runsc are available.
          limactl shell cell -- podman --version
          limactl shell cell -- runsc --version

      - name: Start VM (cache hit)
        if: steps.vm-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: |
          limactl start cell
          for i in $(seq 1 30); do
            STATUS=$(limactl list --json | python3 -c "import sys,json; vms=json.load(sys.stdin); print(next((v['status'] for v in vms if v['name']=='cell'), 'unknown'))" 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "Running" ]; then
              echo "VM is running after ${i}s"
              break
            fi
            sleep 3
          done

      - name: Install brig in VM
        timeout-minutes: 5
        run: |
          limactl shell cell -- sudo pip3 install "$GITHUB_WORKSPACE"
          limactl shell cell -- which brig
          limactl shell cell -- which warden

      - name: Pre-pull mitmproxy image
        timeout-minutes: 3
        run: |
          limactl shell cell -- sudo podman pull docker.io/mitmproxy/mitmproxy@sha256:39ef4ec493d10bf07c71189961c7797b24c445e640ee133efba87fea80d19268

      - name: Start Warden
        timeout-minutes: 3
        run: |
          limactl shell cell -- sudo warden start
          for i in $(seq 1 15); do
            if limactl shell cell -- sudo podman ps --filter name=^warden$ --format '{{.Names}}' | grep -q warden; then
              echo "Warden is running"
              break
            fi
            sleep 2
          done

      # Test suites (continue-on-error to run all, check results after).
      - name: "Test: VM Foundation"
        id: test_vm_foundation
        timeout-minutes: 10
        continue-on-error: true
        run: tests/test_vm_foundation.sh

      - name: "Test: Proxy Policy"
        id: test_proxy_policy
        timeout-minutes: 10
        continue-on-error: true
        run: tests/test_proxy_policy.sh

      - name: "Test: Cell Lifecycle"
        id: test_cell_lifecycle
        timeout-minutes: 10
        continue-on-error: true
        run: tests/test_cell_lifecycle.sh

      - name: "Test: Secrets"
        id: test_secrets
        timeout-minutes: 10
        continue-on-error: true
        run: tests/test_secrets.sh

      - name: "Test: Observability"
        id: test_observability
        timeout-minutes: 10
        continue-on-error: true
        run: tests/test_observability.sh

      - name: "Test: Hardening"
        id: test_hardening
        timeout-minutes: 10
        continue-on-error: true
        run: tests/test_hardening.sh

      - name: "Test: Per-Cell Policy"
        id: test_per_cell_policy
        timeout-minutes: 10
        continue-on-error: true
        run: tests/test_per_cell_policy.sh

      - name: "Test: Warden Features"
        id: test_warden_features
        timeout-minutes: 10
        continue-on-error: true
        run: tests/test_warden_features.sh

      - name: "Test: Stream Passthrough (B4 WebSocket + B5 SSE keepalive)"
        id: test_stream_passthrough
        timeout-minutes: 10
        continue-on-error: true
        run: tests/test_stream_passthrough.sh

      - name: "Test: Invariants 7+8 (foreign container / multi-homed cell)"
        id: test_invariants_7_8
        timeout-minutes: 10
        continue-on-error: true
        run: tests/test_invariants_7_8.sh

      - name: "Test: Containment red-team (Tier-1 adversarial cell)"
        id: test_containment_e2e
        timeout-minutes: 10
        continue-on-error: true
        run: tests/test_containment_e2e.sh

      - name: "Test: Ingress survives brig system down/up"
        # Regression for the aitelier-reported 502 after
        # `brig system down && brig system up && brig cell start`.
        # Verifies cmd_start replays ingress registration with the
        # freshly-inspected cell IP.
        id: test_ingress_replay_e2e
        timeout-minutes: 10
        continue-on-error: true
        run: tests/test_ingress_replay_e2e.sh

      - name: "Benchmark: Stack Overhead"
        id: test_overhead
        timeout-minutes: 15
        continue-on-error: true
        run: |
          RESULTS_FILE=/tmp/e2e-logs/overhead-results.json \
            tests/test_overhead.sh

      - name: Check results
        run: |
          FAILED=0
          for step in \
            "${{ steps.test_vm_foundation.outcome }}" \
            "${{ steps.test_proxy_policy.outcome }}" \
            "${{ steps.test_cell_lifecycle.outcome }}" \
            "${{ steps.test_secrets.outcome }}" \
            "${{ steps.test_observability.outcome }}" \
            "${{ steps.test_hardening.outcome }}" \
            "${{ steps.test_per_cell_policy.outcome }}" \
            "${{ steps.test_warden_features.outcome }}" \
            "${{ steps.test_stream_passthrough.outcome }}" \
            "${{ steps.test_invariants_7_8.outcome }}" \
            "${{ steps.test_containment_e2e.outcome }}" \
            "${{ steps.test_ingress_replay_e2e.outcome }}" \
            "${{ steps.test_overhead.outcome }}"
          do
            if [ "$step" = "failure" ]; then
              FAILED=$((FAILED + 1))
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED test suite(s) failed"
            exit 1
          fi
          echo "All test suites passed"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/e2e-logs
          limactl shell cell -- sudo journalctl --no-pager -n 500 > /tmp/e2e-logs/journalctl.log 2>&1 || true
          limactl shell cell -- sudo podman ps -a > /tmp/e2e-logs/podman-ps.log 2>&1 || true
          limactl shell cell -- sudo podman network ls > /tmp/e2e-logs/podman-networks.log 2>&1 || true
          limactl shell cell -- sudo podman logs warden > /tmp/e2e-logs/warden.log 2>&1 || true
          limactl shell cell -- cat /state/system/subnets.json > /tmp/e2e-logs/subnets.json 2>&1 || true
          cp ~/.lima/cell/ha.stderr.log /tmp/e2e-logs/lima-stderr.log 2>/dev/null || true
          cp ~/.lima/cell/serial.log /tmp/e2e-logs/lima-serial.log 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: /tmp/e2e-logs/
          retention-days: 7
