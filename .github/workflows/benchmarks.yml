name: Benchmarks

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore benchmark history
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: tests/benchmarks/results/
          key: benchmark-history-${{ runner.os }}
          restore-keys: benchmark-history-

      - name: Run benchmarks
        run: |
          pytest tests/benchmarks/ -m bench --benchmark-enable \
            --benchmark-json=results.json \
            --benchmark-min-rounds=5 \
            --benchmark-warmup=on \
            -v

      - name: Check for regressions
        run: |
          if [ -f tests/benchmarks/baseline.json ]; then
            python tests/benchmarks/bench_trend.py check results.json --threshold 10
          else
            echo "No baseline found, skipping regression check"
          fi

      - name: Publish results to job summary
        if: always()
        run: |
          if [ -f results.json ]; then
            python tests/benchmarks/format_results.py results.json \
              ${BASELINE:+--baseline "$BASELINE"} >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          BASELINE: ${{ hashFiles('tests/benchmarks/baseline.json') != '' && 'tests/benchmarks/baseline.json' || '' }}

      - name: Save trend data
        if: github.ref == 'refs/heads/main'
        run: |
          python tests/benchmarks/bench_trend.py save results.json \
            --label "${{ github.sha }}"

      - name: Run memory tests
        run: |
          pytest tests/benchmarks/test_bench_memory.py -v

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            results.json
            tests/benchmarks/results/
