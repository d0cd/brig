# Logrotate configuration for Brig network logs.
#
# Rotates per-cell JSONL logs daily, keeps 7 days of history.
# Install to /etc/logrotate.d/brig in the VM.
#
# Usage:
#   sudo cp brig-logrotate.conf /etc/logrotate.d/brig
#   sudo logrotate -f /etc/logrotate.d/brig  # Force rotation

/var/log/brig/network/*.jsonl {
    # Rotate daily.
    daily

    # Keep 7 days of logs.
    rotate 7

    # Compress rotated logs with gzip.
    compress

    # Don't compress the most recent rotated file (allows tailing).
    delaycompress

    # Don't error if log file is missing.
    missingok

    # Don't rotate empty files.
    notifempty

    # Create new log file with same permissions.
    create 0644 root root

    # Use date extension instead of numbers.
    dateext
    dateformat -%Y%m%d

    # Run postrotate script once for all files.
    sharedscripts

    # Reload mitmproxy to reopen log files after rotation.
    postrotate
        if [ -f /var/run/warden.pid ]; then
            kill -HUP $(cat /var/run/warden.pid) 2>/dev/null || true
        fi
    endscript
}
