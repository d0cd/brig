repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-ast
      - id: no-commit-to-branch

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff

  # mypy runs in CI with relaxed settings (pyproject.toml).
  # Pre-commit mypy is disabled because the src/ layout (brig.py + brig/)
  # causes duplicate module errors that require --explicit-package-bases,
  # which then exposes hundreds of pre-existing implicit Optional issues.
  # TODO: Enable after adding type annotations to the codebase.
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.13.0
  #   hooks:
  #     - id: mypy
  #       args: [--ignore-missing-imports]
  #       additional_dependencies: [pyyaml]
