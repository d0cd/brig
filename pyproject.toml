[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brig"
version = "0.1.0"
description = "Secure workload harness for running untrusted code on macOS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Brig Authors"}
]
keywords = ["security", "containers", "sandbox", "gvisor", "lima"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
brig = "brig_cli:main"
warden = "warden_cli:main"
brig-subnet = "brig_subnet_cli:main"

[project.urls]
Homepage = "https://github.com/d0cd/brig"
Documentation = "https://github.com/d0cd/brig/tree/main/docs"
Repository = "https://github.com/d0cd/brig"

[tool.setuptools]
py-modules = ["brig_cli", "warden_cli", "brig_subnet_cli"]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["brig*", "addons*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
