[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brig"
version = "0.3.1"
description = "Secure workload harness for running untrusted code on macOS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Brig Authors"}
]
keywords = ["security", "containers", "sandbox", "gvisor", "lima"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=2.1.0",
    # types-PyYAML so `mypy src/brig/` is clean locally without CI
    # having to install it inline.
    "types-PyYAML",
    # Real mitmproxy in dev so the addon tests can import the actual
    # symbols instead of MagicMock-ing them. The proxy-side addons
    # (enforce, ingress, logger, notifier, ops) are the most security-
    # critical code in the tree; mocking mitmproxy's API surface means
    # an upstream signature change only surfaces in E2E.
    "mitmproxy>=10.0",
]

[project.scripts]
brig = "brig.cli:main"
warden = "warden.cli:main"

[project.urls]
Homepage = "https://github.com/d0cd/brig"
Documentation = "https://github.com/d0cd/brig/tree/main/docs"
Repository = "https://github.com/d0cd/brig"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
# addons/ is intentionally NOT installed as a Python package — those files
# are mounted into the warden container via `make _copy-addons` and have
# no __init__.py. They are sibling scripts, not a brig submodule.
include = ["brig*", "warden*"]

[tool.setuptools.package-data]
"brig.vm" = ["*.template"]
"brig.observability" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
# F401 is intentionally NOT in this global ignore — orphan imports
# should be flagged. Re-exports opt in per-file via `# noqa: F401`
# (see e.g. src/addons/enforce.py's re-exports for tests and external
# callers).
ignore = ["E402", "E501", "F405"]

[tool.ruff.format]
# Quoting consistency only — keep the formatter conservative so it
# doesn't churn unrelated lines when a security fix lands. Audit
# Quality:8.1 wanted some formatter wired in; this is the minimum useful
# step without imposing a sweeping reformat.
quote-style = "preserve"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "slow: performance/timing-dependent tests",
    "bench: benchmark tests (use --benchmark-enable to run)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    # CLI entry points and VM-dependent modules (tested by smoke test, not unit tests).
    "src/brig/cli.py",
    "src/brig/commands/convenience_cmd.py",
    "src/brig/commands/watchdog_cmd.py",
    "src/brig/commands/secrets_cmd.py",
    "src/brig/commands/system_cmd.py",
    "src/brig/commands/network_cmd.py",
    "src/brig/commands/image_cmd.py",
    "src/brig/commands/config_cmd.py",
    "src/warden/cli.py",
    "src/warden/health.py",
    "src/warden/logs.py",
    "src/warden/stats.py",
    "src/warden/tor.py",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
exclude = ["tests/"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
