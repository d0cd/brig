[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brig"
version = "0.2.0"
description = "Secure workload harness for running untrusted code on macOS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Brig Authors"}
]
keywords = ["security", "containers", "sandbox", "gvisor", "lima"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
tui = ["textual>=0.40"]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
brig = "brig_cli:main"
warden = "warden_cli:main"
brig-subnet = "brig_subnet_cli:main"

[project.urls]
Homepage = "https://github.com/d0cd/brig"
Documentation = "https://github.com/d0cd/brig/tree/main/docs"
Repository = "https://github.com/d0cd/brig"

[tool.setuptools]
py-modules = ["brig_cli", "warden_cli", "brig_subnet_cli", "tui", "brig_subnet", "warden"]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["brig*", "addons*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "F401", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "slow: performance/timing-dependent tests",
    "bench: benchmark tests (use --benchmark-enable to run)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "src/brig_cli.py",
    "src/brig_subnet_cli.py",
    "src/warden_cli.py",
    "src/brig-manpage.py",
    "src/dashboard.py",
    "src/tui.py",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
exclude = ["tests/", "src/dashboard\\.py", "src/tui\\.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
